<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirumala Marriage Services & Suppliers | Marriages & Events</title>
    <meta name="description" content="Complete wedding and event arrangements in Tirupati — function hall booking, accommodation, decorations, catering, purohits, Sannai Melam, photography and bridal makeup for every budget.">
    <meta name="theme-color" content="#5B0E16">
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <!-- Google Fonts: Tiro Telugu (display, 400 + italic) and Mukta (text/UI, 400/500/600) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=Tiro+Telugu:ital@0;1&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS (CDN runtime — matches original) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FDFBF7',
                        ivory: '#F6EEDF',
                        sand: '#E6D5B5',
                        brass: '#9A8459',
                        gold: { DEFAULT: '#D4AF37', light: '#F1D77C', readable: '#856611' },
                        maroon: '#800000',
                        kumkum: { DEFAULT: '#5B0E16', ink: '#2A070B' },
                        charcoal: '#2C2C2C',
                        'ink-soft': '#5E5146',
                        whatsapp: '#25D366',
                    },
                    fontFamily: {
                        display: ['"Tiro Telugu"', 'Georgia', 'serif'],
                        sans: ['Mukta', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
                    },
                    maxWidth: { container: '77.5rem' },
                }
            }
        }
    </script>
</head>
<body class="antialiased overflow-x-hidden text-charcoal bg-cream">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
